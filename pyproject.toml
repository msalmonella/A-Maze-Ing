[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mazegen-hermanos"
version = "0.1.0"
description = "Maze generator implementation for the project a_maze_ing."
authors = [
    { name = "Cahit Atilla Bozkurt" },
    { name = "Ahmet Yasin Dede", email = "ahmetyasindd@gmail.com" }
]
readme = "mazegen/_README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mazegen"]

[tool.uv.sources]
mlx = { path = "mlx/mlx-2.2-py3-none-any.whl" }
